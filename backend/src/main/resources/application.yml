server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/jennydentista}
    username: ${SPRING_DATASOURCE_USERNAME:jenny_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:jenny_secure_2024}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' asegura que la base de datos NUNCA se destruya.
      # Solo actualizará tablas existentes o creará nuevas si es necesario.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always
      continue-on-error: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8083,http://localhost:3000}
