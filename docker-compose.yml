version: '3.8'

services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jennydentista-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jennydentista
      POSTGRES_USER: jenny_admin
      POSTGRES_PASSWORD: jenny_secure_2024

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jenny_admin -d jennydentista"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jennydentista-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jennydentista
      SPRING_DATASOURCE_USERNAME: jenny_admin
      SPRING_DATASOURCE_PASSWORD: jenny_secure_2024
      # 'update' asegura que tu base de datos NUNCA se borre ni se vacíe, 
      # solo se actualiza si hay cambios en el código.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      CORS_ALLOWED_ORIGINS: "*"

    depends_on:
      postgres:
        condition: service_healthy

  # ─── React Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jennydentista-frontend
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
